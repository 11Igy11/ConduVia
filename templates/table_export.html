<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8">
<title>{{TITLE}}</title>
<style>
:root{
    --bg:#0c1520;
    --bg2:#132031;
    --panel:#162334;
    --line:rgba(255,255,255,.10);
    --text:#eaf1fb;
    --muted:#9bb0c9;
    --paper:#ffffff;
    --ink:#111827;
}
*{box-sizing:border-box;}
body{margin:0;padding:24px;font-family:"Segoe UI",Arial,sans-serif;color:var(--text);background:linear-gradient(180deg,var(--bg),var(--bg2));}
.report{max-width:1400px;margin:0 auto;}
.hero{position:relative;border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:22px 24px;margin-bottom:14px;}
.watermark{position:absolute;right:20px;top:14px;width:88px;opacity:.12;}
h1{margin:0;font-size:26px;font-weight:800;}
.meta{margin-top:8px;font-size:13px;color:var(--muted);line-height:1.5;}
.case-table{width:100%;border-collapse:collapse;margin-top:16px;font-size:13px;}
.case-table th,.case-table td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;}
.case-table th{width:200px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;}
.case-table td{color:var(--text);word-break:break-word;}
.table-shell{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel);margin-bottom:12px;}
.table-head{padding:14px 18px;border-bottom:1px solid var(--line);}
.table-head h2{margin:0;font-size:16px;font-weight:700;}
.table-wrap{background:var(--paper);max-height:78vh;overflow:auto;}
table.data{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;}
table.data thead th{position:sticky;top:0;z-index:2;background:#1f2937;color:#fff;padding:10px 12px;text-align:left;white-space:nowrap;border-bottom:2px solid #35a8ff;}
table.data tbody td{padding:8px 12px;color:var(--ink);border-bottom:1px solid #e5e7eb;white-space:nowrap;}
table.data tbody tr:nth-child(even) td{background:#f9fafb;}
.footer{margin-top:8px;text-align:right;color:var(--muted);font-size:12px;}
</style>
</head>
<body>
<div class="report">
  <section class="hero">
    <img class="watermark" src="{{LOGO}}" alt="">
    <h1>{{REPORT_TITLE}}</h1>
    <div class="meta">
      <div><strong>{{EXPORTED_LABEL}}:</strong> {{EXPORTED_AT}} · <strong>{{SOURCE_LABEL}}:</strong> {{SOURCE}}</div>
      <div><strong>{{ROWS_LABEL}}:</strong> {{ROWS_COUNT}} · <strong>{{COLUMNS_LABEL}}:</strong> {{COLUMNS_COUNT}}</div>
    </div>
    {{CASE_TABLE}}
  </section>
  <section class="table-shell">
    <div class="table-head"><h2>{{TABLE_TITLE}}</h2></div>
    <div class="table-wrap">
      <table class="data">
        <thead><tr>{{TABLE_HEADERS}}</tr></thead>
        <tbody>{{TABLE_ROWS}}</tbody>
      </table>
    </div>
  </section>
  <div class="footer">{{GENERATED_BY_LABEL}} ViaNyquist</div>
</div>
</body>
</html>
